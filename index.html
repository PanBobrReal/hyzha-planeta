<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1d26">
<title>Хижа Планета — онлайн</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&family=Unbounded:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1d26;--bg2:#12303b;--ink:#e6f4f1;--dim:#8fb3b0;--aq:#4be3cf;--vi:#b57bff;--red:#ff6b7f;--gold:#ffd166;--line:#245564;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#17434f,transparent),var(--bg);color:var(--ink);font:16px/1.4 'Exo 2',system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:.5em .9em;cursor:pointer}
button:hover:not(:disabled){border-color:var(--aq)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--aq);outline-offset:2px}
button.pri{background:var(--aq);color:#04201c;border-color:var(--aq);font-weight:800}

.home{max-width:420px;margin:8vh auto;padding:20px;display:grid;gap:12px}.sub{color:var(--dim);margin:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.or{color:var(--dim);text-align:center}
.wrap{max-width:1100px;margin:0 auto;padding:12px;display:grid;gap:12px}
.box{background:rgba(18,48,59,.8);border:1px solid var(--line);border-radius:12px;padding:12px}

.ph{font-weight:800;font-size:1.15rem}

.card.h{border-color:var(--red);background:#3a1a24}.card.sv{border-color:var(--aq);background:#0f3338}

.banner.me{border-color:var(--aq);background:#0f4a47;color:#fff}.banner small{display:block;font-weight:400;font-size:.88rem;margin-top:2px;color:inherit;opacity:.85}
details summary{cursor:pointer;color:var(--aq);font-weight:600}details .log{margin-top:8px}.help{display:grid;gap:4px;font-size:.88rem;color:var(--dim);margin-top:8px}
.board{grid-auto-rows:1fr}
.tile{height:100%;min-height:172px;padding:10px 10px 8px}.tile small{margin-top:0}

.whos{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap;padding-top:6px}.who{font-size:.74rem;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--c);color:#111}

.chips.eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.chips.eq .chip{min-height:54px;display:flex;align-items:center}

.trackrow{display:grid;grid-template-columns:repeat(32,1fr);padding:2px}.trackrow .seg{position:relative;width:calc(100% - 8px);height:auto;aspect-ratio:1;margin:4px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:800;line-height:1;border-width:2px}
.seg.L{border-color:#3b8fb0;background:#0d3346;color:#9fd8f2}.seg.A{border-color:#3be08f;background:#0d3b2c;color:#7dffc0}
.seg.S{border-color:var(--gold);background:#4a3a10;color:var(--gold)}.seg.R{border-color:#c4566a;background:#3a1522;color:#ffb3c0}
.tkn{position:absolute;inset:18%;border-radius:50%;border:2px solid #fff;z-index:1}.tkn.rt{background:var(--aq)}.tkn.at{background:var(--vi)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--dim)}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;border:2px solid #fff;vertical-align:-1px}
.dsc{flex:1}.rs{margin-top:6px}.whos{margin-top:0;min-height:26px}
.tile.off{opacity:.5;filter:saturate(.45)}.tile.off .rs{color:var(--dim)}
.sm{padding:.15em .55em;font-size:.8rem;margin-left:6px;min-height:32px}
.chip.d{display:inline-flex;align-items:center;gap:4px;min-height:44px}
.tile.shl{border-color:#5bd6ff;box-shadow:0 0 0 2px #5bd6ff55 inset}
.tile.forb{border-color:#ff6b7f;box-shadow:0 0 0 2px #ff6b7f55 inset}
/* ===== Меню ===== */
input,select{font-size:16px}
.stage{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:18px;padding:clamp(20px,6vh,64px) 16px calc(28px + env(safe-area-inset-bottom))}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 10% 18%,#fff,transparent),radial-gradient(1px 1px at 82% 9%,#cfe,transparent),radial-gradient(2px 2px at 28% 68%,#9fd,transparent),radial-gradient(1px 1px at 62% 38%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 58%,#fff,transparent),radial-gradient(1px 1px at 46% 92%,#fff,transparent),radial-gradient(1px 1px at 6% 86%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 78%,#cde,transparent),radial-gradient(1px 1px at 37% 24%,#fff,transparent);opacity:.75}
.planet{position:absolute;right:-22%;bottom:-6%;width:min(92vmin,660px);aspect-ratio:1;pointer-events:none;opacity:.92}

@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.brand{position:relative;text-align:center;display:grid;gap:6px;justify-items:center}
.kicker{display:flex;align-items:center;gap:14px;font:600 .8rem/1 'Unbounded','Exo 2',sans-serif;letter-spacing:.55em;text-indent:.55em;color:var(--aq)}
.kicker i{height:1px;width:clamp(22px,9vw,70px);background:linear-gradient(90deg,transparent,var(--aq))}.kicker i:last-child{transform:scaleX(-1)}
.wm{position:relative;margin:0;font:900 clamp(2.15rem,12.2vw,5.8rem)/1 'Unbounded','Exo 2','Arial Black',sans-serif;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.5px #bfeee7;filter:drop-shadow(0 0 22px #4be3cf44);background:none}
.wm::after{content:attr(data-t);position:absolute;inset:0;color:var(--aq);-webkit-text-stroke:0;clip-path:inset(0 0 54% 0);background:linear-gradient(90deg,var(--aq),var(--vi));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{margin:6px 0 0;max-width:34ch;color:var(--dim);font-size:.92rem}
.panel{position:relative;width:min(440px,100%);display:grid;gap:12px;padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#12303bd9,#0b1d26d9);backdrop-filter:blur(8px);box-shadow:0 24px 70px #0009}
.lb{font-weight:600;color:var(--aq);font-size:.9rem;letter-spacing:.04em}
.hello{margin:0;font-size:1.1rem}.hello b{color:var(--aq)}
.big{min-height:52px;font-size:1.05rem;border-radius:12px}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;min-height:76px;border-radius:14px;background:#0e2a35;border:1px solid var(--line)}
.choice:hover{border-color:var(--aq);background:#113440}
.choice .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(145deg,#17525a,#2a2a63)}
.choice b{display:block;font-size:1.02rem}.choice small{display:block;color:var(--dim);font-size:.82rem;line-height:1.3;margin-top:2px}
.link{background:none;border:0;color:var(--dim);padding:.4em;min-height:0;text-decoration:underline;text-underline-offset:3px;justify-self:center}.link:hover{color:var(--aq)}
.invite{border:1px dashed var(--aq);border-radius:12px;padding:10px 12px;text-align:center;color:var(--ink);background:#0f3a3a66}.invite b{color:var(--aq);letter-spacing:.2em}
.facts{position:relative;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:440px}
.fact{border:1px solid var(--line);background:#0a2530b3;border-radius:999px;padding:7px 12px;font-size:.82rem;color:var(--dim);white-space:nowrap}.fact b{color:var(--ink);font-weight:600}
.how{position:relative;width:min(440px,100%);border:1px solid var(--line);border-radius:14px;background:#0a2530b3;padding:10px 14px}
.how summary{cursor:pointer;font-weight:600;color:var(--aq)}.how ol{margin:10px 0 2px;padding-left:1.2em;display:grid;gap:8px;color:var(--dim);font-size:.9rem}.how li b{color:var(--ink)}
.wms{font:900 1.15rem/1 'Unbounded','Exo 2',sans-serif;letter-spacing:-.01em;color:var(--aq)}.wms span{color:#bfeee7}
@media(prefers-reduced-motion:reduce){.planet .glow{animation:none}}
.mobonly{display:none}.wi{display:none}
.who.more{background:#3a4f58;color:#fff}
.wholg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--dim);padding:2px 4px}.wholg b{color:var(--ink);font-weight:600}.wholg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.nt{display:grid;gap:8px}
.ntc{display:grid;gap:3px;border:1px solid var(--red);background:#3a1a2466;border-radius:10px;padding:10px 12px}.ntc.sv{border-color:var(--aq);background:#0f333877}
.ntc b{font-size:.98rem}.ntc span{color:var(--dim);font-size:.88rem;line-height:1.35}
.ntf{margin:0;padding-left:1.15em;display:grid;gap:4px;font-size:.9rem;color:var(--ink)}
@media(max-width:700px){.tile{height:auto;min-height:84px;padding:6px}.tile .t{font-size:.8rem}.lc{width:calc(50% - 4px)}.trackrow .seg{width:calc(100% - 2px);margin:1px;font-size:.55rem;border-width:1px}.trk b{width:5.5em}}
@media(prefers-reduced-motion:no-preference){.tile{transition:border-color .15s}}
@media(max-width:700px){
body{font-size:15px}
.wrap{padding:8px 8px calc(16px + env(safe-area-inset-bottom));gap:10px}.box{padding:10px;border-radius:12px}
button{min-height:44px}.chip{min-height:44px}.btns{gap:8px}
.menu{width:100%}.menu button{flex:1;min-height:40px;font-size:.85rem}
.top{gap:6px}.ph{font-size:1rem}
.banner{position:sticky;top:0;z-index:20;margin:0 -2px;font-size:1rem;padding:10px 12px;box-shadow:0 8px 18px #000a}
.board{gap:6px;grid-template-columns:1fr 1fr}
.tile{height:auto;min-height:118px;padding:9px 9px 7px}.tile .t{font-size:.95rem}.tile small.dsc{font-size:.72rem}
.whos{gap:3px}.who{font-size:.68rem}
.mobonly{display:flex!important;justify-content:center}
.board.mini{grid-template-columns:repeat(5,1fr);gap:5px}
.board.mini .tile{min-height:78px;padding:5px 4px;gap:1px;align-items:center;text-align:center;overflow:hidden}
.board.mini .tk{position:static;order:-1;min-height:20px;font-size:.95rem;justify-content:center;flex-wrap:wrap;gap:1px}
.board.mini .tile small.dsc{display:none}.board.mini .tile .n{font-size:.68rem}
.board.mini .tile .t{font-size:.58rem;line-height:1.15;overflow-wrap:normal;word-break:normal;letter-spacing:-.01em}
.board.mini .rl,.board.mini .ri{display:none}.board.mini .rm{display:inline}.board.mini .rs{font-size:.7rem;margin-top:2px}
.board.mini .whos{justify-content:center;gap:2px;padding-top:2px;min-height:0}.board.mini .who{font-size:.6rem;padding:0 5px}
.board.mini .wn{display:none}.board.mini .wi{display:inline}
.cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.card{min-height:118px;padding:10px}.card .x{font-size:.8rem}

.pl{grid-template-columns:1fr}

.kicker{letter-spacing:.45em;text-indent:.45em}
}
.rm{display:none}
</style></head><body><div id="app"></div><div id="toast" role="alert"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let hs={step:'name',name:localStorage.hpn||''},ses=JSON.parse(localStorage.hp||'null'),S=null,es=null,ui={};
const qroom=()=>(new URLSearchParams(location.search).get('room')||'').toUpperCase();
const parseCode=t=>{const m=/room=([A-Za-z]{4})/.exec(t);return (m?m[1]:t).toUpperCase().replace(/[^A-Z]/g,'').slice(0,4)};
const MQ=typeof matchMedia==='function'?matchMedia('(max-width:700px)'):null,isMob=()=>!!(MQ&&MQ.matches),isMini=()=>isMob()&&localStorage.hpm==='1';
if(MQ&&MQ.addEventListener)MQ.addEventListener('change',()=>{if(typeof S!=='undefined'&&S)render()});
const COL=['#ff9f6b','#6bd0ff','#d79bff','#ffe36b','#7dffa8','#ff7b9c'];
function goHome(){if(es)es.close();localStorage.removeItem('hp');ses=null;S=null;ui={};history.replaceState(null,'','/');hs.step=hs.name?'choose':'name';home()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
async function post(a,x={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,room:ses&&ses.room,pid:ses&&ses.pid,tk:ses&&ses.tk,...x})});const j=await r.json();if(j.err)toast(j.err);return j}
function connect(){if(es)es.close();es=new EventSource(`/events?room=${ses.room}&pid=${ses.pid}&tk=${ses.tk}`);es.onmessage=e=>{S=JSON.parse(e.data);render()};es.addEventListener('bad',goHome);es.addEventListener('closed',()=>{toast('Господар закрив кімнату');goHome()})}
const PLANET=`<svg class="planet" viewBox="0 0 400 400" aria-hidden="true"><defs><radialGradient id="pg" cx="34%" cy="30%" r="78%"><stop offset="0" stop-color="#2f9d94"/><stop offset=".42" stop-color="#17434f"/><stop offset="1" stop-color="#091722"/></radialGradient><radialGradient id="eg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6b7f" stop-opacity=".95"/><stop offset="1" stop-color="#ff6b7f" stop-opacity="0"/></radialGradient></defs><g transform="rotate(-18 200 200)"><path d="M5 205A195 46 0 0 1 395 205" fill="none" stroke="#b57bff" stroke-opacity=".5" stroke-width="3"/></g><circle cx="200" cy="200" r="150" fill="url(#pg)"/><circle cx="150" cy="260" r="16" fill="#0a1d28" opacity=".5"/><circle cx="262" cy="270" r="10" fill="#0a1d28" opacity=".5"/><circle cx="130" cy="150" r="9" fill="#0a1d28" opacity=".4"/><g transform="translate(212 190)"><circle class="glow" r="58" fill="url(#eg)"/><path d="M-40 0Q0 -30 40 0Q0 30 -40 0Z" fill="#130812" stroke="#ff6b7f" stroke-width="3"/><ellipse rx="6" ry="17" fill="#ff6b7f"/></g><g transform="rotate(-18 200 200)"><path d="M5 205A195 46 0 0 0 395 205" fill="none" stroke="#b57bff" stroke-opacity=".75" stroke-width="3.5"/></g></svg>`;
const brand=()=>`<div class="brand"><div class="kicker"><i></i><span>ХИЖА</span><i></i></div><h1 class="wm" data-t="ПЛАНЕТА">ПЛАНЕТА</h1><p class="tag">Онлайн-гра на виживання за мотивами настільної гри Гіслена Массона</p></div>`;
function home(){const rc=qroom(),st=hs.step;let p='';
if(st==='name')p=`<label class="lb" for="nm">Ваш нікнейм</label><input id="nm" placeholder="Як вас називати?" maxlength="16" autocomplete="nickname" value="${esc(hs.name)}"><button class="pri big" data-a="nameok">Продовжити →</button>`;
